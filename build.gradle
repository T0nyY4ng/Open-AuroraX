plugins {
    id "fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = "Meteor"; url = uri("https://maven.meteordev.org/releases") }
    maven { name = "Fabric"; url = uri("https://maven.fabricmc.net/") }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:1.21.1+build.2:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "meteordevelopment:meteor-client:${meteor_version}"
    modCompileOnly files("libs/baritone-api-fabric-1.11.2.jar")
}

loom {
    accessWidenerPath = file("src/main/resources/aurora.accesswidener")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain {
        // The local build host provides JDK 22; bytecode remains Java 21 compatible.
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
